<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDUGAMESKIDS - Crear cuenta de estudiante</title>
  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/style-registro-estudiante.css">
</head>
<body>
  <div class="register-screen">
    <div class="bg-circle circle-top-left"></div>
    <div class="bg-circle circle-top-right"></div>
    <div class="bg-circle circle-bottom-left"></div>
    <div class="bg-circle circle-bottom-right"></div>

    <header class="header">
      <div class="header-content">
        <a href="index.html" class="brand" aria-label="Edugameskids, inicio">
          <div class="logo-box">
            <img class="logo-img" src="assets/img/logo_pg.png" alt="Logotipo Edugameskids">
          </div>
          <span class="brand-name">EDUGAMESKIDS</span>
        </a>
      </div>
    </header>

    <main class="main-content">
      <div class="register-container">
        <section class="info-side">
          <div class="info-card">
            <h1 class="info-title">¡Únete a la aventura!</h1>
            <p class="info-desc">Crea tu cuenta para guardar tus puntos y tus logros.</p>
          </div>
        </section>

        <section class="form-side">
          <div class="form-card">
            <h2 class="form-title">Crear cuenta de estudiante</h2>
            
            <div class="register-form">
              <div class="form-group">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" name="nombre" class="form-input" placeholder="Escribe tu nombre" required>
              </div>

              <div class="form-group">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="nombre@colegio.com" required>
              </div>

              <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Mínimo 6 caracteres" required>
              </div>

              <div class="form-group">
                <label for="confirm-password" class="form-label">Confirmar contraseña</label>
                <input type="password" id="confirm-password" name="confirm-password" class="form-input" placeholder="Repite la contraseña" required>
              </div>

              <div class="form-group">
                <label for="curso" class="form-label">Curso</label>
                <div class="select-wrapper">
                  <select id="curso" name="curso" class="form-input form-select" required>
                    <option value="" disabled selected hidden>Selecciona tu curso</option>
                    <option value="1">Primero de primaria</option>
                    <option value="2">Segundo de primaria</option>
                    <option value="3">Tercero de primaria</option>
                    <option value="4">Cuarto de primaria</option>
                    <option value="5">Quinto de primaria</option>
                  </select>
                </div>
              </div>

              <button type="button" class="btn-submit" onclick="registrarYRedirigir('estudiante')"> Crear mi cuenta </button>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
<script src="js/main.js"></script>
</body>
</html>
