<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDUGAMESKIDS - Error 500</title>
  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/500-style.css">
</head>
<body>
  <div class="error-page">
    
    <!-- HEADER PRINCIPAL -->
    <header class="header">
      <div class="header-content">
        <a href="index.html" class="brand">
          <div class="logo-box">
            <img src="assets/img/logo_pg.png" alt="Logo Edugameskids" class="logo-img">
          </div>
          <span class="brand-name">EDUGAMESKIDS</span>
        </a>
        <span class="header-slogan">Pequeños exploradores, grandes aventuras.</span>
      </div>
    </header>

    <!-- SUB-HEADER CON ESTILO DE LÍNEA -->
    <div class="subheader">
      <div class="subheader-content">
        <div class="subheader-left">
          <span class="dot-bullet"></span>
          <span>Equivocarse también es parte de aprender.</span>
        </div>
        <span class="subheader-right">Jugar. Descubrir. Aprender.</span>
      </div>
    </div>

    <!-- CONTENIDO CENTRAL -->
    <main class="main-content">
      <div class="content-container">
        
        <!-- COLUMNA IZQUIERDA: TEXTO Y ACCIÓN -->
        <div class="error-text-side">
          <span class="error-badge">ERROR 500</span>
          <h1 class="error-title">¡Algo salió mal!</h1>
          <p class="error-desc">
            Estamos teniendo un pequeño problema. Inténtalo de nuevo.
          </p>
          <a href="index.html" class="btn-home">Volver al inicio</a>
          <span class="error-subtext">Puedes volver a intentarlo en unos momentos.</span>
        </div>

        <!-- COLUMNA DERECHA: TARJETA ILUSTRADA -->
        <div class="error-image-side">
          <div class="robot-card">
            <img src="assets/img/Robot en pausa.png" alt="Robot Error 500" class="robot-img">
            <div class="robot-footer-tag">
              
            </div>
          </div>
        </div>

      </div>
    </main>

  </div>
</body>
</html>
