<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDUGAMESKIDS - Crear cuenta de acudiente</title>
  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/style-registro-acudiente.css">
</head>
<body>
  <div class="register-screen">
    <div class="bg-circle circle-top-left"></div>
    <div class="bg-circle circle-top-right"></div>
    <div class="bg-circle circle-bottom-left"></div>
    <div class="bg-circle circle-bottom-right"></div>

    <header class="header">
      <div class="header-content">
        <a href="index.html" class="brand" aria-label="Edugameskids, inicio">
          <div class="logo-box">
            <img class="logo-img" src="assets/img/logo_pg.png" alt="Logotipo Edugameskids">
          </div>
          <span class="brand-name">EDUGAMESKIDS</span>
        </a>
      </div>
    </header>

    <main class="main-content">
      <div class="register-container">
        <section class="info-side">
          <div class="info-card">
            <h1 class="info-title">¡Acompaña cada descubrimiento!</h1>
            <p class="info-desc">Crea tu cuenta para seguir el aprendizaje de tu hijo/a.</p>
          </div>
        </section>

        <section class="form-side">
          <div class="form-card">
            <h2 class="form-title">Crear cuenta de acudiente</h2>
            
            <div class="register-form">
              <div class="form-row-2col">
                <div class="form-group">
                  <label for="nombres" class="form-label">Nombres</label>
                  <input type="text" id="nombres" name="nombres" class="form-input" placeholder="Escribe tus nombres" required>
                </div>
                <div class="form-group">
                  <label for="apellidos" class="form-label">Apellidos</label>
                  <input type="text" id="apellidos" name="apellidos" class="form-input" placeholder="Escribe tus apellidos" required>
                </div>
              </div>

              <div class="form-group">
                <label for="doc-number" class="form-label">Número de documento</label>
                <input type="text" id="doc-number" name="doc-number" class="form-input" placeholder="Ej. 12345678" required>
              </div>

              <div class="form-group">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="nombre@correo.com" required>
              </div>

              <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Crea una contraseña" required>
              </div>

              <div class="form-group">
                <label for="confirm-password" class="form-label">Confirmar contraseña</label>
                <input type="password" id="confirm-password" name="confirm-password" class="form-input" placeholder="Repite la contraseña" required>
              </div>

              <button type="button" class="btn-submit" onclick="registrarYRedirigir('acudiente')">Crear cuenta de acudiente</button>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
<script src="js/main.js"></script>
</body>
</html>
