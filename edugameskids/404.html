<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDUGAMESKIDS - Error 404</title>
  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/404-style.css">
</head>
<body>
  <div class="error-404-screen">
    
    <!-- HEADER PRINCIPAL -->
    <header class="header">
      <div class="header-content">
        <a href="index.html" class="brand" aria-label="Ir a la página de inicio">
          <div class="logo-box">
            <img class="logo-img" src="assets/img/logo_pg.png" alt="Logotipo Edugameskids">
          </div>
          <span class="brand-name">EDUGAMESKIDS</span>
        </a>
        <span class="header-slogan">Pequeños exploradores, grandes aventuras.</span>
      </div>
    </header>

    <!-- CONTENIDO CENTRAL -->
    <main class="main-content">
      <div class="content-container">
        
        <!-- COLUMNA IZQUIERDA: TEXTO Y ACCIÓN -->
        <div class="error-text-side">
          <span class="error-badge">ERROR 404</span>
          <h1 class="error-title">¡Ups! No encontramos esta página</h1>
          <p class="error-desc">
            Parece que esta aventura se perdió en el mapa.
          </p>
          <a href="index.html" class="btn-home">Volver al inicio</a>
          <span class="error-subtext">Volvamos al punto de partida.</span>
        </div>

        <!-- COLUMNA DERECHA: TARJETA ILUSTRADA MAPA 404 -->
        <div class="error-image-side">
          <div class="map-card">
            <!-- Recuerda exportar esta ilustración como PNG/SVG desde Figma -->
            <img src="assets/img/Mapa de la aventura.png" alt="Ilustración Mapa Error 404" class="map-img">
            <div class="map-footer-tag">
              <span class="tag-line"></span> La aventura sigue en el inicio
            </div>
          </div>
        </div>

      </div>
    </main>

    <!-- SUB-HEADER / FOOTER BAR EN LA PARTE INFERIOR -->
    <footer class="bottom-bar">
      <div class="bottom-bar-content">
        <div class="bottom-left">
          <span class="dot-bullet"></span>
          <span>Perderse también es parte de explorar.</span>
        </div>
        <span class="bottom-right">Jugar. Descubrir. Aprender.</span>
      </div>
    </footer>

  </div>
</body>
</html>
