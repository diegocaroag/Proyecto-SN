<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - EDGMS</title>
    <!-- Enlace a los estilos CSS unificados -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="cuerpo-login">

    <main class="contenedor-login">
        <div class="tarjeta-login">
            
            <!-- Cabecera limpia con el logo y textos -->
            <div class="login-header">
                <div class="logo-superior-login">
                    <img src="assets/img/log.jpg" alt="Logo EDGMS" class="logo-imagen">
                    <span class="texto-logo">EDGMS</span>
                </div>
                <h1>Bienvenido de nuevo</h1>
                <p>Ingresa a tu cuenta para continuar</p>
            </div>

            <!-- Formulario con sus IDs listos para la redirección -->
            <form id="formulario-login" class="formulario-estilo">
                <div class="grupo-input">
                    <label for="email-login">Correo electrónico</label>
                    <input type="email" id="email-login" placeholder="Correo electrónico" required>
                </div>

                <div class="grupo-input">
                    <label for="password-login">Contraseña</label>
                    <input type="password" id="password-login" placeholder="••••••••" required>
                </div>

                <!-- Alerta dinámica (éxito o error) -->
                <div id="mensaje-alerta-login" style="display: none; padding: 0.75rem; border-radius: 10px; font-size: 0.85rem; text-align: center; font-weight: 600;"></div>

                <button type="submit" class="boton-principal">Iniciar Sesión</button>
            </form>

            <!-- Pie de tarjeta con accesos de navegación -->
            <div class="login-footer">
                <p>¿No tienes una cuenta? <a href="formulario.html">Regístrate aquí</a></p>
                <a href="index.html" class="enlace-volver">← Volver al inicio</a>
            </div>

        </div>
    </main>

    <!-- Script principal que valida el login y hace la redirección al dashboard -->
    <script src="js/main.js"></script>
</body>
</html>
