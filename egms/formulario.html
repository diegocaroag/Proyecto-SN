<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Inmersivo - EDGMS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="cuerpo-login pantalla-completa-registro">

    <main class="contenedor-inmersivo">
        <div class="tarjeta-inmersiva">
            
            <!-- Encabezado con toque visual elegante -->
            <div class="login-header">
                <div class="logo-superior-login">
                    <img src="assets/img/log.jpg" alt="Logo EDGMS" class="logo-imagen">
                    <span class="texto-logo">EDGMS Core</span>
                </div>
                <h1>Crea tu cuenta</h1>
                <p>Configura tu perfil institucional para el sistema ADSO</p>
            </div>

            <!-- Formulario Dinámico -->
            <form id="formulario-registro" class="formulario-estilo">
                
                <div class="fila-doble">
                    <div class="grupo-input">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" placeholder="Ej. Pepito Perez" required>
                    </div>
                    <div class="grupo-input">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" placeholder="@prueba.com" required>
                    </div>
                </div>

                <div class="fila-doble">
                    <div class="grupo-input">
                        <label for="rol">Rol en el Sistema</label>
                        <select id="rol" class="input-select-apple" required>
                            <option value="">Selecciona rol...</option>
                            <option value="Estudiante">Estudiante</option>
                            <option value="Docente">Docente</option>
                            <option value="Acudiente">Acudiente</option>
                        </select>
                    </div>
                    <div class="grupo-input">
                        <label for="curso">Curso </label>
                        <input type="text" id="curso" placeholder="Ej. 4to B" required>
                    </div>
                </div>

                <div class="fila-doble">
                    <div class="grupo-input">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
                    </div>
                    <div class="grupo-input">
                        <label for="confirm-password">Confirmar contraseña</label>
                        <input type="password" id="confirm-password" placeholder="Repite tu contraseña" required>
                    </div>
                </div>

                <!-- Alerta dinámica con animación de aparición -->
                <div id="mensaje-alerta" class="alerta-animada" style="display: none;"></div>

                <button type="submit" class="boton-principal-animado">Registrarse Ahora</button>
            </form>

            <div class="login-footer">
                <p>¿Ya tienes una cuenta en el sistema? <a href="login.html">Inicia sesión</a></p>
                <a href="index.html" class="enlace-volver">← Volver al inicio</a>
            </div>

        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
